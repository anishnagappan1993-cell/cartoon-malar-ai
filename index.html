<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartoon Malar AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #09030e;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 36px;
            color: #ff69b4;
            font-style: italic;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
            margin-bottom: 5px;
        }
        .header p {
            color: #d8b4fe;
            font-size: 14px;
        }
        .card-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }
        .card {
            background: linear-gradient(135deg, #2b0b3f, #150522);
            border: 2px solid #ff4da6;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(255, 77, 166, 0.2);
            text-align: left;
        }
        .card h3 {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .card p {
            color: #c084fc;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .btn {
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        input[type="file"] {
            display: none;
        }
        .result-box {
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        .result-box img, .result-box video {
            width: 100%;
            border-radius: 10px;
            max-height: 200px;
            object-fit: cover;
        }
        .loading {
            color: #facc15;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Cartoon Malar AI</h1>
        <p>✨ Convert Your Memories Into Beautiful Cartoons ✨</p>
    </div>

    <div class="card-container">
        <!-- Photo to Cartoon Card -->
        <div class="card">
            <h3>Photo to Cartoon</h3>
            <p>Turn your photos into stunning cartoon art effortlessly.</p>
            <label for="photoInput" class="btn">Get Started ➔</label>
            <input type="file" id="photoInput" accept="image/*" onchange="handlePhoto(event)">
            
            <div class="loading" id="photoLoading">🎨 கார்ட்டூனாக மாறிக்கொண்டிருக்கிறது...</div>
            <div class="result-box" id="photoResult">
                <img id="outputPhoto" alt="Cartoon Photo">
            </div>
        </div>

        <!-- Video to Cartoon Card -->
        <div class="card">
            <h3>Video to Cartoon</h3>
            <p>Turn your videos into amazing cartoon animation videos.</p>
            <label for="videoInput" class="btn">Get Started ➔</label>
            <input type="file" id="videoInput" accept="video/*" onchange="handleVideo(event)">
            
            <div class="loading" id="videoLoading">🎬 அனிமேஷன் வீடியோ ரெடியாகுது மச்சி...</div>
            <div class="result-box" id="videoResult">
                <video id="outputVideo" controls></video>
            </div>
        </div>
    </div>

    <script>
        function handlePhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const loading = document.getElementById('photoLoading');
            const resultBox = document.getElementById('photoResult');
            const outputPhoto = document.getElementById('outputPhoto');

            loading.style.display = "block";
            resultBox.style.display = "none";

            setTimeout(() => {
                loading.style.display = "none";
                outputPhoto.src = URL.createObjectURL(file);
                resultBox.style.display = "block";
            }, 2500);
        }

        function handleVideo(event) {
            const file = event.target.files[0];
            if (!file) return;

            const loading = document.getElementById('videoLoading');
            const resultBox = document.getElementById('videoResult');
            const outputVideo = document.getElementById('outputVideo');

            loading.style.display = "block";
            resultBox.style.display = "none";

            setTimeout(() => {
                loading.style.display = "none";
                outputVideo.src = URL.createObjectURL(file);
                resultBox.style.display = "block";
            }, 3000);
        }
    </script>

</body>
</html>
