<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cartoon Malar AI Video</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b12;
  color:white;
}

.app{
  max-width:500px;
  margin:auto;
  min-height:100vh;
  padding:20px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.badge{
  background:#713cff;
  padding:7px 12px;
  border-radius:20px;
  font-size:11px;
}

.card{
  background:#111722;
  border:1px solid #293142;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
}

h1{
  font-size:25px;
  margin:5px 0 10px;
}

p{
  color:#9da7b8;
  line-height:1.5;
}

label{
  display:block;
  margin:15px 0 8px;
  font-weight:bold;
}

.upload{
  border:2px dashed #3b465b;
  border-radius:16px;
  padding:28px 15px;
  text-align:center;
  cursor:pointer;
}

.upload-icon{
  font-size:42px;
}

input[type=file]{
  display:none;
}

.preview{
  display:none;
  text-align:center;
  margin-top:15px;
}

.preview img{
  width:170px;
  max-height:230px;
  object-fit:cover;
  border-radius:15px;
}

select,textarea{
  width:100%;
  background:#0b1019;
  border:1px solid #30394a;
  color:white;
  padding:13px;
  border-radius:12px;
  font-size:15px;
}

textarea{
  min-height:80px;
  resize:none;
}

button{
  width:100%;
  border:0;
  padding:15px;
  border-radius:13px;
  background:linear-gradient(135deg,#7547ff,#b344ff);
  color:white;
  font-size:17px;
  font-weight:bold;
  margin-top:18px;
}

button:active{
  transform:scale(.98);
}

.progress{
  display:none;
  margin-top:15px;
}

.progress-bar{
  width:100%;
  height:9px;
  background:#202938;
  border-radius:10px;
  overflow:hidden;
}

.progress-fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#7547ff,#c044ff);
}

.video-box{
  display:none;
  text-align:center;
}

video{
  width:100%;
  max-height:520px;
  border-radius:18px;
  background:#000;
}

.actions{
  display:flex;
  gap:10px;
}

.actions button{
  flex:1;
}

.secondary{
  background:#202938;
}

.status{
  text-align:center;
  color:#aeb8ca;
  margin-top:10px;
}

footer{
  text-align:center;
  color:#687386;
  font-size:12px;
  padding:20px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">🌸 Cartoon Malar AI</div>
  <div class="badge">AI VIDEO</div>
</header>

<div class="card">

<h1>📸 Photo → Cartoon Video</h1>

<p>
ஒரு புகைப்படத்தை தேர்வு செய்து அழகான 9:16 Cartoon வீடியோ உருவாக்குங்கள்.
</p>

<label>📸 உங்கள் புகைப்படம்</label>

<label class="upload" for="photo">
  <div class="upload-icon">🖼️</div>
  <div>புகைப்படத்தை தேர்வு செய்யுங்கள்</div>
  <p>JPG / PNG</p>
</label>

<input id="photo" type="file" accept="image/*">

<div class="preview" id="preview">
  <img id="previewImg">
</div>

<label>🎨 Cartoon Style</label>

<select id="style">
  <option>Soft 3D Cartoon</option>
  <option>Cinematic Cartoon</option>
  <option>Anime Cartoon</option>
  <option>Realistic Cartoon</option>
  <option>Dreamy Cartoon</option>
</select>

<label>✍️ Scene</label>

<textarea id="prompt"
placeholder="உதாரணம்: கடற்கரையில் sunset, அழகான background..."></textarea>

<button onclick="createVideo()">
✨ Cartoon Video உருவாக்கு
</button>

<div class="progress" id="progress">

<p id="progressText">வீடியோ தயாராகிறது...</p>

<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>

</div>

</div>

<div class="card video-box" id="videoBox">

<h2>🎬 உங்கள் Cartoon Video</h2>

<video id="resultVideo" controls playsinline></video>

<div class="actions">

<button class="secondary" onclick="downloadVideo()">
⬇️ Save
</button>

<button class="secondary" onclick="shareVideo()">
📤 Share
</button>

</div>

</div>

<footer>
Cartoon Malar AI • AI Video Creator
</footer>

</div>

<script>

const photo = document.getElementById("photo");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");

let selectedImage = null;
let videoBlob = null;

photo.addEventListener("change",function(){

  const file=this.files[0];

  if(!file)return;

  selectedImage=new Image();

  selectedImage.onload=function(){

    previewImg.src=URL.createObjectURL(file);
    preview.style.display="block";

  };

  selectedImage.src=URL.createObjectURL(file);

});


async function createVideo(){

  if(!photo.files[0]){

    alert("முதலில் ஒரு புகைப்படத்தை தேர்வு செய்யுங்கள்.");

    return;
  }

  if(!selectedImage){

    alert("புகைப்படம் தயாராகவில்லை.");

    return;
  }

  const progress=document.getElementById("progress");
  const fill=document.getElementById("progressFill");
  const progressText=document.getElementById("progressText");

  progress.style.display="block";

  progressText.innerText="🎨 Cartoon video தயாராகிறது...";

  fill.style.width="10%";

  const canvas=document.createElement("canvas");

  canvas.width=720;
  canvas.height=1280;

  const ctx=canvas.getContext("2d");

  const stream=canvas.captureStream(30);

  let recorder;

  const options={
    mimeType:"video/webm;codecs=vp9"
  };

  if(MediaRecorder.isTypeSupported(options.mimeType)){
    recorder=new MediaRecorder(stream,options);
  }else{
    recorder=new MediaRecorder(stream);
  }

  const chunks=[];

  recorder.ondataavailable=function(e){

    if(e.data.size>0){
      chunks.push(e.data);
    }

  };

  recorder.onstop=function(){

    videoBlob=new Blob(chunks,{type:"video/webm"});

    const url=URL.createObjectURL(videoBlob);

    const video=document.getElementById("resultVideo");

    video.src=url;

    document.getElementById("videoBox").style.display="block";

    progressText.innerText="✅ Cartoon Video Ready!";

    fill.style.width="100%";

    document.getElementById("videoBox")
      .scrollIntoView({behavior:"smooth"});

  };

  recorder.start();

  const duration=6000;
  const start=performance.now();

  function draw(now){

    const elapsed=now-start;

    const progressValue=Math.min(elapsed/duration,1);

    fill.style.width=(10+progressValue*85)+"%";

    ctx.fillStyle="#080b12";

    ctx.fillRect(0,0,canvas.width,canvas.height);

    const imageRatio=
      selectedImage.width/selectedImage.height;

    const canvasRatio=
      canvas.width/canvas.height;

    let drawWidth;
    let drawHeight;

    if(imageRatio>canvasRatio){

      drawHeight=canvas.height;

      drawWidth=drawHeight*imageRatio;

    }else{

      drawWidth=canvas.width;

      drawHeight=drawWidth/imageRatio;

    }

    const zoom=1+progressValue*0.12;

    drawWidth*=zoom;
    drawHeight*=zoom;

    const x=(canvas.width-drawWidth)/2;

    const y=(canvas.height-drawHeight)/2;

    ctx.save();

    ctx.filter=
      "contrast(1.08) saturate(1.18) brightness(1.05)";

    ctx.drawImage(
      selectedImage,
      x,
      y,
      drawWidth,
      drawHeight
    );

    ctx.restore();

    // Cartoon-style overlay

    const gradient=ctx.createLinearGradient(
      0,0,
      0,canvas.height
    );

    gradient.addColorStop(
      0,
      "rgba(80,30,180,0.18)"
    );

    gradient.addColorStop(
      1,
      "rgba(10,0,30,0.28)"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    // Title

    const style=document.getElementById("style").value;

    ctx.textAlign="center";

    ctx.font="bold 48px Arial";

    ctx.fillStyle="white";

    ctx.shadowColor="black";

    ctx.shadowBlur=12;

    ctx.fillText(
      "✨ "+style,
      canvas.width/2,
      90
    );

    ctx.shadowBlur=0;

    // Bottom branding

    ctx.font="bold 34px Arial";

    ctx.fillStyle="white";

    ctx.fillText(
      "🌸 Cartoon Malar AI",
      canvas.width/2,
      canvas.height-70
    );

    if(progressValue<1){

      requestAnimationFrame(draw);

    }else{

      setTimeout(function(){

        recorder.stop();

      },200);

    }

  }

  requestAnimationFrame(draw);

}


function downloadVideo(){

  if(!videoBlob){

    alert("முதலில் வீடியோ உருவாக்குங்கள்.");

    return;
  }

  const url=URL.createObjectURL(videoBlob);

  const a=document.createElement("a");

  a.href=url;

  a.download="cartoon-malar-video.webm";

  document.body.appendChild(a);

  a.click();

  a.remove();

}


async function shareVideo(){

  if(!videoBlob){

    alert("முதலில் வீடியோ உருவாக்குங்கள்.");

    return;
  }

  const file=new File(
    [videoBlob],
    "cartoon-malar-video.webm",
    {type:"video/webm"}
  );

  if(
    navigator.share &&
    navigator.canShare &&
    navigator.canShare({files:[file]})
  ){

    try{

      await navigator.share({
        title:"Cartoon Malar AI",
        text:"என் Cartoon Video 🌸",
        files:[file]
      });

    }catch(e){}

  }else{

    alert("இந்த browser-ல் video share வசதி இல்லை. Save செய்து WhatsApp / Instagram-ல் பகிரலாம்.");

  }

}

</script>

</body>
    </html>
