<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartoon Malar AI</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#070910;
 color:#fff;
 font-family:Arial,sans-serif;
}

.app{
 width:100%;
 max-width:520px;
 margin:auto;
 min-height:100vh;
 padding:18px;
}

header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:20px;
}

.logo{
 font-size:23px;
 font-weight:800;
}

.badge{
 background:linear-gradient(135deg,#7047ff,#c247ff);
 padding:7px 11px;
 border-radius:20px;
 font-size:11px;
}

.card{
 background:#111621;
 border:1px solid #272e3d;
 border-radius:20px;
 padding:18px;
 margin-bottom:16px;
}

.hero h1{
 margin:0 0 8px;
 font-size:28px;
}

.muted{
 color:#9ba5b6;
 line-height:1.5;
}

.tabs{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:18px;
}

.tab{
 padding:14px;
 border-radius:14px;
 border:1px solid #303849;
 background:#0c111b;
 color:#fff;
 font-weight:bold;
}

.tab.active{
 background:linear-gradient(135deg,#7047ff,#bd43ff);
 border:0;
}

.upload{
 display:block;
 border:2px dashed #3b465a;
 border-radius:18px;
 padding:30px 12px;
 text-align:center;
 cursor:pointer;
}

.upload-icon{
 font-size:42px;
 margin-bottom:8px;
}

input[type=file]{
 display:none;
}

.preview{
 display:none;
 margin-top:15px;
 text-align:center;
}

.preview img,
.preview video{
 width:100%;
 max-height:330px;
 object-fit:contain;
 border-radius:16px;
 background:#000;
}

label.title{
 display:block;
 margin:15px 0 8px;
 font-weight:bold;
}

select,
textarea{
 width:100%;
 padding:14px;
 border-radius:13px;
 border:1px solid #303849;
 background:#090e17;
 color:#fff;
 font-size:15px;
}

textarea{
 min-height:85px;
 resize:none;
}

button{
 width:100%;
 margin-top:15px;
 padding:15px;
 border:0;
 border-radius:14px;
 color:#fff;
 background:linear-gradient(135deg,#7047ff,#bd43ff);
 font-size:16px;
 font-weight:800;
}

button.secondary{
 background:#202838;
}

button:disabled{
 opacity:.5;
}

.result{
 display:none;
}

.result img,
.result video{
 width:100%;
 max-height:520px;
 border-radius:18px;
 background:#000;
 object-fit:contain;
}

.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.status{
 display:none;
 margin-top:15px;
 text-align:center;
 color:#b9c2d2;
}

.loader{
 width:34px;
 height:34px;
 border:4px solid #303849;
 border-top-color:#9a5cff;
 border-radius:50%;
 animation:spin .8s linear infinite;
 margin:10px auto;
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

footer{
 text-align:center;
 color:#687386;
 font-size:12px;
 padding:18px;
}
</style>
</head>

<body>

<div class="app">

<header>
 <div class="logo">🌸 Cartoon Malar AI</div>
 <div class="badge">AI CREATOR</div>
</header>

<div class="card hero">

 <h1>Photo & Video → Cartoon ✨</h1>

 <div class="muted">
 Upload one photo or one normal video and create your cartoon version.
 </div>

 <div class="tabs">
  <button class="tab active" id="photoTab" onclick="setMode('photo')">
   📸 Photo
  </button>

  <button class="tab" id="videoTab" onclick="setMode('video')">
   🎥 Video
  </button>
 </div>

</div>

<div class="card">

 <label class="title">Upload</label>

 <label class="upload" for="media">

  <div class="upload-icon" id="uploadIcon">🖼️</div>

  <strong id="uploadTitle">
   Select one photo
  </strong>

  <div class="muted" id="uploadHelp">
   JPG, PNG or WEBP
  </div>

 </label>

 <input id="media" type="file" accept="image/*">

 <div class="preview" id="preview">

  <img id="imagePreview">

  <video
   id="videoPreview"
   controls
   playsinline>
  </video>

 </div>

 <label class="title">🎨 Cartoon Style</label>

 <select id="style">

  <option>Cinematic 3D</option>
  <option>Soft 3D Cartoon</option>
  <option>Anime</option>
  <option>Cute Cartoon</option>
  <option>Comic</option>

 </select>

 <label class="title">✍️ Scene / Prompt</label>

 <textarea
 id="prompt"
 placeholder="Example: beautiful sunset beach, cinematic lighting..."></textarea>

 <button id="generateBtn" onclick="generate()">
  ✨ Create Cartoon
 </button>

 <div class="status" id="status">

  <div class="loader"></div>

  <div id="statusText">
   Preparing...
  </div>

 </div>

</div>

<div class="card result" id="result">

 <h2>✨ Result</h2>

 <img id="resultImage">

 <video
  id="resultVideo"
  controls
  playsinline>
 </video>

 <div class="actions">

  <button
   class="secondary"
   onclick="downloadResult()">
   ⬇️ Download
  </button>

  <button
   class="secondary"
   onclick="shareResult()">
   📤 Share
  </button>

 </div>

</div>

<footer>
 Cartoon Malar AI • Photo & Video Cartoon Creator
</footer>

</div>

<script>

let mode="photo";
let selectedFile=null;
let resultUrl=null;

const media=document.getElementById("media");
const preview=document.getElementById("preview");
const imagePreview=document.getElementById("imagePreview");
const videoPreview=document.getElementById("videoPreview");

function setMode(newMode){

 mode=newMode;

 document.getElementById("photoTab")
  .classList.toggle("active",mode==="photo");

 document.getElementById("videoTab")
  .classList.toggle("active",mode==="video");

 selectedFile=null;
 media.value="";
 preview.style.display="none";

 if(mode==="photo"){

  media.accept="image/*";

  document.getElementById("uploadIcon").textContent="🖼️";

  document.getElementById("uploadTitle").textContent=
   "Select one photo";

  document.getElementById("uploadHelp").textContent=
   "JPG, PNG or WEBP";

 }else{

  media.accept="video/*";

  document.getElementById("uploadIcon").textContent="🎥";

  document.getElementById("uploadTitle").textContent=
   "Select one normal video";

  document.getElementById("uploadHelp").textContent=
   "MP4, MOV or WEBM";

 }

}

media.addEventListener("change",function(){

 const file=this.files[0];

 if(!file)return;

 selectedFile=file;

 const url=URL.createObjectURL(file);

 preview.style.display="block";

 if(mode==="photo"){

  imagePreview.src=url;

  imagePreview.style.display="block";

  videoPreview.style.display="none";

 }else{

  videoPreview.src=url;

  videoPreview.style.display="block";

  imagePreview.style.display="none";

 }

});

async function generate(){

 if(!selectedFile){

  alert(
   mode==="photo"
   ? "முதலில் ஒரு போட்டோ தேர்வு செய்யுங்கள்."
   : "முதலில் ஒரு வீடியோ தேர்வு செய்யுங்கள்."
  );

  return;
 }

 const style=document.getElementById("style").value;
 const prompt=document.getElementById("prompt").value.trim();

 const status=document.getElementById("status");
 const statusText=document.getElementById("statusText");

 status.style.display="block";

 statusText.textContent="AI service checking...";

 /*
  IMPORTANT:

  The real AI request must be sent to a secure backend.

  Do NOT put GEMINI_API_KEY or another secret
  directly inside this HTML file.

  Backend endpoints can be connected here:

  POST /api/cartoon-image
  POST /api/cartoon-video

  The backend should receive:
  - uploaded media
  - selected style
  - prompt

  and return the generated media URL.
 */

 try{

  const endpoint =
   mode==="photo"
   ? "/api/cartoon-image"
   : "/api/cartoon-video";

  const formData=new FormData();

  formData.append("media",selectedFile);
  formData.append("style",style);
  formData.append("prompt",prompt);

  const response=await fetch(endpoint,{
   method:"POST",
   body:formData
  });

  if(!response.ok){
   throw new Error("AI backend not configured");
  }

  const data=await response.json();

  if(!data.url){
   throw new Error("No generated result");
  }

  showResult(data.url);

 }catch(error){

  statusText.textContent=
   "AI service இன்னும் இணைக்கப்படவில்லை.";

  alert(
   "AI generation backend இன்னும் இணைக்கப்படவில்லை. " +
   "API key-ஐ HTML-ல் போடாமல் secure backend மூலம் இணைக்க வேண்டும்."
  );

 }

}

function showResult(url){

 resultUrl=url;

 const result=document.getElementById("result");

 const resultImage=document.getElementById("resultImage");

 const resultVideo=document.getElementById("resultVideo");

 result.style.display="block";

 if(mode==="photo"){

  resultImage.src=url;
  resultImage.style.display="block";
  resultVideo.style.display="none";

 }else{

  resultVideo.src=url;
  resultVideo.style.display="block";
  resultImage.style.display="none";

 }

 document.getElementById("status").style.display="none";

 result.scrollIntoView({
  behavior:"smooth"
 });

}

function downloadResult(){

 if(!resultUrl){

  alert("முதலில் result உருவாக வேண்டும்.");

  return;
 }

 const a=document.createElement("a");

 a.href=resultUrl;

 a.download=
  mode==="photo"
  ? "cartoon-malar.jpg"
  : "cartoon-malar-video.mp4";

 document.body.appendChild(a);

 a.click();

 a.remove();

}

async function shareResult(){

 if(!resultUrl){

  alert("முதலில் result உருவாக வேண்டும்.");

  return;
 }

 if(navigator.share){

  try{

   await navigator.share({
    title:"Cartoon Malar AI",
    text:"Created with Cartoon Malar AI",
    url:resultUrl
   });

  }catch(e){}

 }else{

  alert(
   "இந்த browser-ல் direct share இல்லை. Download செய்து Share செய்யலாம்."
  );

 }

}

</script>

</body>
</html>
