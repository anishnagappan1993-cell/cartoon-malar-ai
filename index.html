<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartoon Malar AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b12;
  color:white;
}
.app{
  max-width:500px;
  margin:auto;
  min-height:100vh;
  padding:20px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}
.logo{
  font-size:25px;
  font-weight:bold;
}
.badge{
  background:#6c3cff;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
}
.card{
  background:#111722;
  border:1px solid #252d3b;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
}
h1{
  font-size:27px;
  margin:5px 0 8px;
}
p{
  color:#9da7b8;
  line-height:1.5;
}
.upload{
  border:2px dashed #39445a;
  border-radius:16px;
  padding:28px 15px;
  text-align:center;
  cursor:pointer;
}
.upload:hover{
  border-color:#7b4dff;
}
.upload-icon{
  font-size:42px;
}
input[type=file]{display:none}
.preview{
  display:none;
  margin-top:15px;
  text-align:center;
}
.preview img{
  width:180px;
  max-height:230px;
  object-fit:cover;
  border-radius:15px;
}
label{
  display:block;
  margin:15px 0 8px;
  color:#dce2ee;
  font-weight:bold;
}
select,textarea{
  width:100%;
  background:#0b1019;
  border:1px solid #30394a;
  color:white;
  padding:13px;
  border-radius:12px;
  font-size:15px;
}
textarea{
  min-height:90px;
  resize:none;
}
button{
  width:100%;
  border:0;
  padding:15px;
  border-radius:13px;
  background:linear-gradient(135deg,#7547ff,#b344ff);
  color:white;
  font-size:17px;
  font-weight:bold;
  margin-top:18px;
  cursor:pointer;
}
button:active{
  transform:scale(.98);
}
.result{
  display:none;
  text-align:center;
}
.result-box{
  aspect-ratio:9/16;
  max-height:420px;
  border-radius:18px;
  background:linear-gradient(160deg,#24134c,#101b35,#44214e);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  margin-top:15px;
}
.result-text{
  font-size:24px;
  font-weight:bold;
  text-align:center;
}
.actions{
  display:flex;
  gap:10px;
}
.actions button{
  margin-top:12px;
}
.secondary{
  background:#202938;
}
footer{
  text-align:center;
  color:#687386;
  font-size:12px;
  padding:20px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">🌸 Cartoon Malar AI</div>
  <div class="badge">AI STUDIO</div>
</header>

<div class="card">
  <h1>உங்கள் புகைப்படத்தை Cartoon ஆக மாற்றுங்கள் ✨</h1>
  <p>புகைப்படத்தை upload செய்து உங்களுக்கு பிடித்த cartoon style-ஐ தேர்வு செய்யுங்கள்.</p>
</div>

<div class="card">

  <label>📸 புகைப்படம்</label>

  <label class="upload" for="photo">
    <div class="upload-icon">🖼️</div>
    <div>புகைப்படத்தை தேர்வு செய்ய அழுத்துங்கள்</div>
    <p>JPG / PNG</p>
  </label>

  <input id="photo" type="file" accept="image/*">

  <div class="preview" id="preview">
    <img id="previewImg">
  </div>

  <label>🎨 Cartoon Style</label>

  <select id="style">
    <option>Cinematic 3D</option>
    <option>Soft 3D Cartoon</option>
    <option>Pixar Style</option>
    <option>Anime Cartoon</option>
    <option>Realistic Cartoon</option>
  </select>

  <label>✍️ உங்கள் Scene / Prompt</label>

  <textarea id="prompt" placeholder="உதாரணம்: கடற்கரையில் அழகான sunset background..."></textarea>

  <button onclick="generate()">✨ Cartoon உருவாக்கு</button>

</div>

<div class="card result" id="result">

  <h2>✨ உங்கள் Cartoon</h2>

  <div class="result-box">
    <div class="result-text" id="resultText">
      Cartoon Malar AI<br>
      <small>9:16 Premium Preview</small>
    </div>
  </div>

  <div class="actions">
    <button class="secondary" onclick="downloadImage()">⬇️ Save</button>
    <button class="secondary" onclick="shareApp()">📤 Share</button>
  </div>

</div>

<footer>
  Cartoon Malar AI • Premium AI Cartoon Creator
</footer>

</div>

<script>

const photo = document.getElementById("photo");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");

photo.addEventListener("change", function(){

  const file = this.files[0];

  if(file){
    previewImg.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }

});

function generate(){

  const style = document.getElementById("style").value;
  const prompt = document.getElementById("prompt").value;

  if(!photo.files[0]){
    alert("முதலில் ஒரு புகைப்படத்தை தேர்வு செய்யுங்கள்.");
    return;
  }

  document.getElementById("result").style.display = "block";

  document.getElementById("resultText").innerHTML =
    "✨ Cartoon Ready!<br><br>" +
    "<small>" + style + "<br>9:16 Premium Preview</small>";

  document.getElementById("result").scrollIntoView({
    behavior:"smooth"
  });

}

function downloadImage(){

  alert("AI image generation API இணைத்த பிறகு உண்மையான image download இங்கே வேலை செய்யும்.");

}

function shareApp(){

  if(navigator.share){
    navigator.share({
      title:"Cartoon Malar AI",
      text:"Cartoon Malar AI மூலம் என் cartoon உருவாக்கினேன்!"
    });
  }else{
    alert("Share வசதி இந்த browser-ல் கிடைக்கவில்லை.");
  }

}

</script>

</body>
  </html>
