<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartoon Malar AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at 10% 10%, #6d28d9 0, transparent 28%),
    radial-gradient(circle at 90% 20%, #db2777 0, transparent 25%),
    radial-gradient(circle at 50% 100%, #2563eb 0, transparent 30%),
    #070914;
}

header{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(7,9,20,.82);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  font-size:23px;
  font-weight:800;
}

.logo span{
  margin-right:7px;
}

.loginBtn{
  border:0;
  color:#fff;
  font-weight:700;
  padding:11px 18px;
  border-radius:24px;
  background:linear-gradient(135deg,#7c3aed,#d946ef);
}

.container{
  max-width:720px;
  margin:auto;
  padding:25px 16px 60px;
}

.hero{
  text-align:center;
  padding:25px 10px;
}

.hero h1{
  font-size:34px;
  margin-bottom:12px;
}

.hero p{
  color:#aeb4c7;
  line-height:1.6;
}

.card{
  background:rgba(18,23,38,.88);
  border:1px solid rgba(255,255,255,.10);
  border-radius:25px;
  padding:20px;
  margin-top:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.28);
}

.switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}

.switch button{
  height:58px;
  border-radius:17px;
  border:1px solid #343b52;
  background:#0c101c;
  color:#fff;
  font-size:17px;
  font-weight:700;
}

.switch button.active{
  border:0;
  background:linear-gradient(135deg,#7c3aed,#d946ef);
}

.label{
  display:block;
  margin:18px 0 9px;
  font-size:16px;
  font-weight:700;
}

.upload{
  border:2px dashed #414960;
  min-height:190px;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  cursor:pointer;
  background:rgba(8,11,21,.45);
}

.upload:hover{
  border-color:#a855f7;
}

.uploadIcon{
  font-size:48px;
  margin-bottom:10px;
}

.uploadTitle{
  font-size:18px;
  font-weight:700;
}

.uploadSub{
  color:#9299ad;
  margin-top:7px;
}

input[type=file]{
  display:none;
}

.preview{
  width:100%;
  max-height:430px;
  object-fit:contain;
  border-radius:20px;
  margin-top:14px;
  background:#000;
  display:none;
}

select,
textarea,
input{
  width:100%;
  border:1px solid #343b52;
  background:#090d18;
  color:#fff;
  border-radius:16px;
  padding:15px;
  font-size:16px;
  outline:none;
}

select{
  height:54px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

select:focus,
textarea:focus,
input:focus{
  border-color:#a855f7;
}

.create{
  width:100%;
  height:60px;
  border:0;
  border-radius:18px;
  margin-top:20px;
  color:#fff;
  font-size:18px;
  font-weight:800;
  background:linear-gradient(135deg,#7c3aed,#d946ef);
}

.create:disabled{
  opacity:.55;
}

.status{
  display:none;
  text-align:center;
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  background:#0d1220;
  border:1px solid #30384e;
}

.spinner{
  width:34px;
  height:34px;
  border:4px solid #343b52;
  border-top-color:#c084fc;
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.result{
  display:none;
  margin-top:18px;
}

.result video,
.result img{
  width:100%;
  border-radius:20px;
  background:#000;
}

.download{
  display:block;
  text-align:center;
  text-decoration:none;
  color:#fff;
  font-weight:800;
  background:#16a34a;
  padding:15px;
  border-radius:16px;
  margin-top:12px;
}

.loginModal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:420px;
  background:#121726;
  border:1px solid #343b52;
  border-radius:25px;
  padding:25px;
}

.loginBox h2{
  margin-bottom:18px;
}

.loginBox input{
  margin-top:10px;
}

.loginBox button{
  width:100%;
  margin-top:14px;
  height:52px;
  border:0;
  border-radius:15px;
  color:#fff;
  font-weight:700;
  background:linear-gradient(135deg,#7c3aed,#d946ef);
}

.close{
  background:#252b3b!important;
}

.footer{
  text-align:center;
  color:#70778c;
  margin-top:35px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <span>🌸</span>Cartoon Malar AI
  </div>
  <button class="loginBtn" onclick="openLogin()">LOGIN</button>
</header>

<div class="container">

  <section class="hero">
    <h1>Photo & Video → Cartoon ✨</h1>
    <p>
      ஒரு போட்டோ அல்லது ஒரு சாதாரண வீடியோவை upload செய்து
      AI cartoon version உருவாக்குங்கள்.
    </p>
  </section>

  <div class="card">

    <div class="switch">
      <button id="photoBtn" class="active" onclick="setMode('photo')">
        📸 Photo
      </button>

      <button id="videoBtn" onclick="setMode('video')">
        🎥 Video
      </button>
    </div>

    <label class="label">📤 Upload</label>

    <label class="upload" for="fileInput">

      <div>
        <div class="uploadIcon" id="uploadIcon">🖼️</div>

        <div class="uploadTitle" id="uploadTitle">
          Select one photo
        </div>

        <div class="uploadSub" id="uploadSub">
          JPG, PNG or WEBP
        </div>
      </div>

    </label>

    <input
      id="fileInput"
      type="file"
      accept="image/jpeg,image/png,image/webp"
      onchange="handleFile(event)"
    >

    <img id="imagePreview" class="preview">

    <video
      id="videoPreview"
      class="preview"
      controls
      playsinline
    ></video>

    <label class="label">🎨 Cartoon Style</label>

    <select id="style">
      <option value="cinematic_3d">Cinematic 3D</option>
      <option value="soft_3d">Soft 3D Cartoon</option>
      <option value="anime">Anime</option>
      <option value="pixar_like">3D Animated</option>
      <option value="comic">Comic</option>
      <option value="watercolor">Watercolor Cartoon</option>
    </select>

    <label class="label">✍️ Scene / Prompt</label>

    <textarea
      id="prompt"
      placeholder="உதாரணம்: அழகான sunset beach, cinematic lighting..."
    ></textarea>

    <button class="create" id="createBtn" onclick="createCartoon()">
      ✨ Create Cartoon
    </button>

    <div class="status" id="status">
      <div class="spinner"></div>
      <div id="statusText">AI cartoon உருவாக்கப்படுகிறது...</div>
    </div>

    <div class="result" id="result">
      <h3 style="margin-bottom:12px;">✨ Your Cartoon Result</h3>

      <video
        id="resultVideo"
        controls
        playsinline
        style="display:none"
      ></video>

      <img
        id="resultImage"
        style="display:none"
      >

      <a
        id="downloadBtn"
        class="download"
        href="#"
        download
      >
        ⬇️ Download Cartoon
      </a>
    </div>

  </div>

  <div class="footer">
    🌸 Cartoon Malar AI • AI Photo & Video Cartoon Creator
  </div>

</div>

<!-- LOGIN -->

<div class="loginModal" id="loginModal">

  <div class="loginBox">

    <h2>🔐 Cartoon Malar AI Login</h2>

    <input
      id="loginEmail"
      type="email"
      placeholder="Email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login / Create Account
    </button>

    <button class="close" onclick="closeLogin()">
      Close
    </button>

  </div>

</div>

<script>

let mode = "photo";
let selectedFile = null;

/* =========================
   MODE
========================= */

function setMode(newMode){

  mode = newMode;

  const photoBtn = document.getElementById("photoBtn");
  const videoBtn = document.getElementById("videoBtn");

  const fileInput = document.getElementById("fileInput");

  const uploadIcon = document.getElementById("uploadIcon");
  const uploadTitle = document.getElementById("uploadTitle");
  const uploadSub = document.getElementById("uploadSub");

  const imagePreview = document.getElementById("imagePreview");
  const videoPreview = document.getElementById("videoPreview");

  selectedFile = null;

  fileInput.value = "";

  imagePreview.style.display = "none";
  videoPreview.style.display = "none";

  if(mode === "photo"){

    photoBtn.classList.add("active");
    videoBtn.classList.remove("active");

    uploadIcon.textContent = "🖼️";
    uploadTitle.textContent = "Select one photo";
    uploadSub.textContent = "JPG, PNG or WEBP";

    fileInput.accept =
      "image/jpeg,image/png,image/webp";

  }else{

    videoBtn.classList.add("active");
    photoBtn.classList.remove("active");

    uploadIcon.textContent = "🎥";
    uploadTitle.textContent = "Select one normal video";
    uploadSub.textContent = "MP4, MOV or WEBM";

    fileInput.accept =
      "video/mp4,video/quicktime,video/webm";
  }
}


/* =========================
   FILE
========================= */

function handleFile(event){

  const file = event.target.files[0];

  if(!file) return;

  selectedFile = file;

  const imagePreview =
    document.getElementById("imagePreview");

  const videoPreview =
    document.getElementById("videoPreview");

  const url = URL.createObjectURL(file);

  if(mode === "photo"){

    imagePreview.src = url;
    imagePreview.style.display = "block";

    videoPreview.style.display = "none";

  }else{

    videoPreview.src = url;
    videoPreview.style.display = "block";

    imagePreview.style.display = "none";

    /*
      IMPORTANT:
      Browser preview keeps the original
      video's audio track.
    */

    videoPreview.muted = false;
  }
}


/* =========================
   CREATE CARTOON
========================= */

async function createCartoon(){

  if(!selectedFile){

    alert(
      mode === "photo"
      ? "முதலில் ஒரு போட்டோ தேர்வு செய்யுங்கள்."
      : "முதலில் ஒரு வீடியோ தேர்வு செய்யுங்கள்."
    );

    return;
  }

  const createBtn =
    document.getElementById("createBtn");

  const status =
    document.getElementById("status");

  const statusText =
    document.getElementById("statusText");

  const result =
    document.getElementById("result");

  const style =
    document.getElementById("style").value;

  const prompt =
    document.getElementById("prompt").value;

  createBtn.disabled = true;

  result.style.display = "none";
  status.style.display = "block";

  statusText.textContent =
    "AI cartoon உருவாக்கப்படுகிறது...";

  try{

    const formData = new FormData();

    formData.append("file", selectedFile);
    formData.append("mode", mode);
    formData.append("style", style);
    formData.append("prompt", prompt);

    /*
      SECURE BACKEND

      API key இங்கே போடக்கூடாது.

      Backend endpoint:
      /api/generate
    */

    const response = await fetch(
      "/api/generate",
      {
        method:"POST",
        body:formData
      }
    );

    if(!response.ok){

      throw new Error(
        "AI backend connection failed"
      );
    }

    const data = await response.json();

    if(!data.output){

      throw new Error(
        "AI output கிடைக்கவில்லை"
      );
    }

    showResult(data.output);

  }catch(error){

    console.error(error);

    alert(
      "AI backend இன்னும் இணைக்கப்படவில்லை.\n\n" +
      "Frontend தயாராக உள்ளது. " +
      "அடுத்ததாக secure AI backend இணைக்க வேண்டும்."
    );

  }finally{

    createBtn.disabled = false;
    status.style.display = "none";
  }
}


/* =========================
   RESULT
========================= */

function showResult(output){

  const result =
    document.getElementById("result");

  const resultVideo =
    document.getElementById("resultVideo");

  const resultImage =
    document.getElementById("resultImage");

  const downloadBtn =
    document.getElementById("downloadBtn");

  result.style.display = "block";

  if(mode === "video"){

    resultVideo.src = output;
    resultVideo.style.display = "block";

    resultImage.style.display = "none";

    downloadBtn.href = output;
    downloadBtn.download =
      "cartoon-malar-video.mp4";

  }else{

    resultImage.src = output;
    resultImage.style.display = "block";

    resultVideo.style.display = "none";

    downloadBtn.href = output;
    downloadBtn.download =
      "cartoon-malar-image.png";
  }
}


/* =========================
   LOGIN UI
========================= */

function openLogin(){

  document.getElementById(
    "loginModal"
  ).style.display = "flex";
}

function closeLogin(){

  document.getElementById(
    "loginModal"
  ).style.display = "none";
}

function login(){

  const email =
    document.getElementById("loginEmail").value;

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    alert("Email மற்றும் Password கொடுக்கவும்.");

    return;
  }

  /*
    Real production login should use
    Firebase Authentication or another
    secure authentication backend.

    Do NOT store passwords in localStorage.
  */

  alert(
    "Login UI தயாராக உள்ளது. " +
    "அடுத்த step-ல் secure Firebase Login இணைக்கலாம்."
  );

  closeLogin();
}

</script>

</body>
 </html>
